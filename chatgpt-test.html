<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test ChatGPT - Hestia Aura</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07090f;
      color: #eef1f6;
    }
    .card {
      width: min(92vw, 680px);
      padding: 36px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 22px;
      background: #0d111a;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
      text-align: center;
    }
    .badge {
      display: inline-block;
      margin-bottom: 18px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(108,108,255,.16);
      border: 1px solid rgba(108,108,255,.45);
      color: #c9c9ff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 12px; font-size: clamp(30px, 6vw, 48px); }
    p { margin: 0; color: #aeb6c4; line-height: 1.6; }
    strong { color: #ffffff; }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">Branche chatgpt-test</div>
    <h1>Environnement de test actif ✅</h1>
    <p>Si tu vois cette page, le déploiement Cloudflare de la branche <strong>chatgpt-test</strong> fonctionne correctement. La branche <strong>main</strong> et le site de production n'ont pas été modifiés.</p>
  </main>
</body>
</html>
